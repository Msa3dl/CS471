{% extends "layouts/base.html" %}

{% block title %}Book Form{% endblock title %}

{% block content %}

<h1>
    {% if book %}
        Edit Book
    {% else %}
        Add Book
    {% endif %}
</h1>

<form method="post">
    {% csrf_token %}

    <label>Title:</label>
    <input type="text" name="title" value="{{ book.title|default:'' }}">
    <br><br>

    <label>Author:</label>
    <input type="text" name="author" value="{{ book.author|default:'' }}">
    <br><br>

    <label>Price:</label>
    <input type="number" step="0.01" name="price" value="{{ book.price|default:'' }}">
    <br><br>

    <label>Edition:</label>
    <input type="number" name="edition" value="{{ book.edition|default:'' }}">
    <br><br>

    <button type="submit">Save</button>
</form>

<br>

<a href="{% url 'books.lab10_part1_listbooks' %}">Back to Books</a>

{% endblock content %}
