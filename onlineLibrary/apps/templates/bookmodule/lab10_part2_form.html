{% extends "layouts/base.html" %}

{% block title %}Book Form - Part 2{% endblock title %}

{% block content %}

<h1>
    {% if book %}
        Edit Book
    {% else %}
        Add Book
    {% endif %}
</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">Save</button>
</form>

<br>

<a href="{% url 'books.lab10_part2_listbooks' %}">Back to Books</a>

{% endblock content %}
