{% extends "layouts/base.html" %}

{% block title %}Student Form - Task 2{% endblock title %}

{% block content %}

<h1>
    {% if student %}
        Edit Student
    {% else %}
        Add Student
    {% endif %}
</h1>

    {{ form.as_p }}

    <button type="submit">Save</button>
</form>

<br>

<a href="{% url 'books.lab11_task2_list' %}">Back to Students</a>

{% endblock content %}
