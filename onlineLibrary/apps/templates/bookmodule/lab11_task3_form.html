{% extends "layouts/base.html" %}

{% block title %}Product Form{% endblock title %}

{% block content %}

<h1>
    {% if product %}
        Edit Product
    {% else %}
        Add Product
    {% endif %}
</h1>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Save</button>
</form>

<br>

<a href="{% url 'books.lab11_task3_list' %}">Back to Products</a>

{% endblock content %}
